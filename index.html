<!DOCTYPE html>
<html>
  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Word Link Game...</title>
    
    <!-- Open Graph Meta Tags for WhatsApp and social media -->
    <meta property="og:title" content="🧠 I challenge you to a Word Puzzle!" />
    <meta property="og:description" content="Think you can solve this? Tap to play my word puzzle challenge now!" />
    <meta property="og:image" content="https://sureshgvl.github.io/wordgame-challenges/assets/icon.png" />
    <meta property="og:url" content="https://sureshgvl.github.io/wordgame-challenges" />
    <meta property="og:type" content="website" />
    
    <script>
      // Wait for DOM to load
      window.onload = function () {
        const params = new URLSearchParams(window.location.search);
        const data = params.get("data");
        
        // Your custom URI scheme
        const deepLink = `mywordgame://challenge?data=${data}`;
        
        // Fallback to Play Store if app is not installed
        const fallbackUrl = "https://play.google.com/store/apps/details?id=com.sg.WordLink";

        // Try to open the app
        window.location.href = deepLink;

        // If app isn't installed, redirect after a short delay
        setTimeout(() => {
          window.location.href = fallbackUrl;
        }, 1500);
      };
    </script>
  </head>
  <body>
    <p>Opening your word game...</p>
  </body>
</html>
